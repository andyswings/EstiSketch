{% set name = "EstiSketch" %}
{% set version = "0.4.0b0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  entry_points:
    - estisketch = EstiSketch.main:main

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
  run:
    - python
    - gtk4 >=4.20.3
    - pygobject >=3.54.5
    - gobject-introspection >=1.84.0
    - cairo >=1.18.4
    - pycairo
    - numpy
    - reportlab

test:
  imports:
    - EstiSketch
    - EstiSketch.main
  commands:
    - python -c "import EstiSketch; print(EstiSketch.__version__)"
    - python -m EstiSketch.main --version

about:
  home: https://github.com/andyswings/EstiSketch
  license: MIT
  license_file: LICENSE.txt
  summary: A lightweight 2-D floor-plan sketcher and building estimator
  description: |
    EstiSketch is an evolving, lightweight tool designed for contractors and
    designers to quickly sketch building plans and perform preliminary cost estimates.
  dev_url: https://github.com/andyswings/EstiSketch

extra:
  recipe-maintainers:
    - andyswings
