[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EstiSketch"
dynamic = ["version"]
description = "A lightweight 2-D floor-plan sketcher and building estimation tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Andrew Sharon", email = "andrewsharon@gmx.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyGObject",
    "pycairo",
    "numpy",
]

[project.optional-dependencies]
pdf-takeoff = ["reportlab"]

[project.scripts]
estisketch = "EstiSketch.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "EstiSketch.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
EstiSketch = [
    "*.json",
    "Resources/*.json",
    "Icons/*",
    "_native_3d*.so",
    "_native_3d*.pyd",
    "_native_3d*.dylib",
]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
