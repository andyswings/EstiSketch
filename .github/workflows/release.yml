name: Release Builds

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.*"
      - "v[0-9]+.[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            python3-cairo \
            python3-numpy \
            python3-reportlab \
            python3-pytest \
            python3-dev \
            xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build native 3D Python extension
        run: /usr/bin/python3 packaging/build_native_3d.py

      - name: Run test suite
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a /usr/bin/python3 -m pytest -v

  build-deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build .deb package
        run: python3 packaging/build_deb.py

      - name: Verify .deb package
        run: |
          DEB_FILE="$(ls dist/*.deb | head -n 1)"
          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error

  build-appimage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install GTK4, Python, and AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            python3-cairo \
            python3-numpy \
            python3-reportlab \
            python3-venv \
            python3-pip \
            wget \
            file \
            xvfb

      - name: Set up PyInstaller build environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .build_venv
          .build_venv/bin/pip install --upgrade pip pyinstaller
          .build_venv/bin/pip install --no-deps --no-build-isolation .

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export PATH="$PWD/.build_venv/bin:$PATH"
          bash packaging/build_pyinstaller_appimage.sh

      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          APPIMAGE="$(ls dist/*.AppImage | head -n 1)"
          chmod +x "$APPIMAGE"
          OUT="$(xvfb-run -a "$APPIMAGE" --version)"
          echo "AppImage output: $OUT"
          echo "$OUT" | grep -q "EstiSketch 0.4.0-beta"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-package
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Miniforge with conda-forge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          miniforge-variant: Miniforge3
          channels: conda-forge
          channel-priority: strict
          activate-environment: base
          auto-activate: true

      - name: Install conda-build and constructor
        run: conda install -n base -y -c conda-forge conda-build constructor

      - name: Build Windows .exe installer
        run: ./packaging/build_windows_installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-deb, build-appimage, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check pre-release tag
        id: tag_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qiE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.tag_meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
